name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run package:release
      - name: Verify release bundle
        run: |
          unzip -l dist/langscape-*.zip | grep -E 'main\.js|manifest\.json|styles\.css'
